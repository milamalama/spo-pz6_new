{% extends 'base.html' %}

{% block title %}
Вход
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-12 col-sm-10 col-md-8 col-lg-5">

        <div class="card">

            <div class="card-body p-4">

                <h2 class="card-title text-center mb-4">
                    Вход в систему
                </h2>

                <form method="post">

                    {% csrf_token %}

                    {{ form.non_field_errors }}

                    <div class="mb-3">

                        <label class="form-label">
                            Имя пользователя
                        </label>

                        {{ form.username }}

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Пароль
                        </label>

                        {{ form.password }}

                    </div>


                    <div class="form-footer">

                        <button type="submit"
                                class="btn btn-primary w-100">

                            Войти

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}

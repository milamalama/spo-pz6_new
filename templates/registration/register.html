{% extends 'base.html' %}

{% block title %}
Регистрация
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-12 col-sm-10 col-md-8 col-lg-5">

        <div class="card">

            <div class="card-body p-4">

                <h2 class="card-title text-center mb-4">
                    Создание аккаунта
                </h2>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit"
                            class="btn btn-primary w-100">

                        Зарегистрироваться

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
